aid: stellation
name: Stellation Capital
description: >-
  Stellation Capital is a Brooklyn-based pre-seed and seed venture capital firm founded in 2021 by
  Peter A. Boyce II, who spent eight years at General Catalyst and co-founded its student-founder
  program Rough Draft Ventures. Operating under the tagline "Backing Founders At First Light" and
  the thesis "Present Before Proof," Stellation raised a $40M debut fund and writes first checks of
  roughly $250K-$2.5M, leading and co-leading rounds for "philomath" founding teams whose identities
  are inseparable from the problems they are solving — across AI and personal computing, fintech,
  consumer software, online safety, climate/energy, and consumer health. Portfolio companies include
  Strobe Power, Revin, Tapestry, Hopscotch (acquired by Avalara), Software Applications Incorporated,
  swsh, Block Party, Hearth Display, and Vybe. Stellation is also a partner fund in Foundry Group's
  portfolio, which is how it entered the API Evangelist network. The firm publishes no APIs; this
  profile carries its identity and portfolio graph.
